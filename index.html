<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程耗材與工具成本調查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --danger:#C97A6D; --danger-bg:#F5E3E0;
  --radius:14px;
  --shadow:0 2px 10px rgba(55,53,47,0.06);
  --shadow-lg:0 8px 28px rgba(55,53,47,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;}
::selection{background:var(--soft-pink);}

#app{max-width:900px;margin:0 auto;padding:0 20px 80px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(250,250,248,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(55,53,47,0.08);
}
.topbar-inner{max-width:900px;margin:0 auto;padding:16px 20px 16px;position:relative;}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;}
.brand-mark{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.brand-mark img{width:100%;height:100%;object-fit:contain;}
.brand-text{text-align:left;}
.brand-text h1{font-family:'Noto Serif TC',serif;font-size:25px;font-weight:900;letter-spacing:0.5px;}
.brand-text span{font-size:12px;color:var(--gray);}
.brand-actions{display:flex;gap:8px;position:absolute;top:16px;right:20px;}
@media(max-width:560px){
  .topbar-inner{padding:14px 16px;}
  .brand-actions{position:static;justify-content:flex-end;margin-bottom:10px;}
  .brand-text h1{font-size:20px;}
}
.icon-btn{
  width:34px;height:34px;border-radius:10px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;color:var(--medium);
  font-size:15px;flex-shrink:0;
}
.icon-btn:hover{background:var(--light-pink);}

main{padding-top:22px;}
.hidden{display:none !important;}

.card{
  background:#fff;border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);border:1px solid rgba(55,53,47,0.05);
}
.card+.card{margin-top:14px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);}
.subtle{color:var(--gray);font-size:12.5px;}
.hero{
  background:linear-gradient(135deg,var(--light-pink) 0%, var(--light-blue) 100%);
  border-radius:18px;padding:24px 22px;margin-top:18px;
  border:1px solid rgba(255,255,255,0.6);
}
.hero h2{font-size:19px;line-height:1.6;color:var(--dark);}
.hero p{margin-top:8px;color:var(--medium);font-size:13.5px;line-height:1.7;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;
  background:var(--dark);color:#fff;
}
.btn:hover{opacity:0.88;}
.btn.primary{background:var(--pink);color:#fff;}
.btn.outline{background:#fff;border:1.5px solid rgba(55,53,47,0.14);color:var(--dark);}
.btn.ghost{background:var(--cream);color:var(--medium);}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn.block{width:100%;}
.btn.danger{background:var(--danger);color:#fff;}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.spacer{flex:1;}

.course-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.course-item{
  background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  border:1px solid rgba(55,53,47,0.05);border-left:4px solid var(--soft-pink);
  cursor:pointer;transition:transform .12s ease;
}
.course-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
.course-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.course-item h3{font-size:15.5px;}
.course-item .meta{font-size:12px;color:var(--gray);margin-top:3px;}
.course-item .total{font-size:20px;font-weight:900;color:var(--pink);flex-shrink:0;text-align:right;}
.course-item .total small{display:block;font-size:10.5px;font-weight:700;color:var(--gray);}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray);}
.empty-state .emoji{font-size:34px;margin-bottom:10px;}
.empty-state h3{color:var(--medium);font-size:15px;margin-bottom:6px;}
.empty-state p{font-size:13px;line-height:1.6;max-width:340px;margin:0 auto 16px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--medium);margin-bottom:6px;}
.hint{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.5;}
.hint-list{margin:6px 0 0;padding-left:16px;font-size:11px;color:var(--gray);line-height:1.6;}
.hint-list li{margin-bottom:6px;}
.hint-list li:last-child{margin-bottom:0;}
.field input[type=text],.field input[type=number]{
  width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid rgba(55,53,47,0.28);
  font-size:14px;background:#fff;color:var(--dark);outline:none;
}
.field input:focus{border-color:var(--pink);}

.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.back-btn{width:34px;height:34px;border-radius:10px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--medium);flex-shrink:0;}
.detail-header .btn{flex-shrink:0;}
.course-name-input{
  flex:1;min-width:0;font-size:18px;font-weight:700;background:#fff;color:var(--dark);outline:none;
  border:1.5px solid rgba(55,53,47,0.28);border-radius:9px;padding:8px 10px;
}
.course-name-input:focus{border-color:var(--pink);}

.item-card{
  background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);
  border:1px solid rgba(55,53,47,0.05);margin-bottom:10px;
}
.item-card .item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
.item-card .item-name-input{
  flex:1;min-width:0;font-size:14.5px;font-weight:700;background:#fff;color:var(--dark);outline:none;
  border:1.5px solid rgba(55,53,47,0.25);border-radius:8px;padding:7px 9px;
}
.item-card .item-name-input:focus{border-color:var(--pink);}
.item-card .rm-btn{
  width:28px;height:28px;border-radius:8px;background:var(--danger-bg);color:var(--danger);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;
}
.item-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:520px){.item-grid{grid-template-columns:1fr 1fr;}}
.item-grid .mini-field label{display:block;font-size:10.5px;color:var(--gray);font-weight:700;margin-bottom:4px;}
.item-grid .mini-field input{
  width:100%;padding:8px 9px;border-radius:8px;border:1.5px solid rgba(55,53,47,0.3);
  font-size:13px;background:#fff;color:var(--dark);outline:none;
}
.item-grid .mini-field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(201,147,138,0.15);}
.item-cost-line{
  margin-top:10px;padding-top:10px;border-top:1px dashed rgba(55,53,47,0.1);
  display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--medium);
}
.item-cost-line b{font-size:15px;color:var(--dark);}

.total-box{
  background:linear-gradient(135deg,var(--light-pink),var(--light-blue));
  border-radius:16px;padding:20px;margin-top:16px;text-align:center;
}
.total-box .tlabel{font-size:12.5px;color:var(--medium);font-weight:700;margin-bottom:6px;}
.total-box .tvalue{font-size:32px;font-weight:900;color:var(--dark);}
.total-box .thint{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.7;}
.total-box .copy-btn{margin-top:12px;}

#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;
  z-index:200;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.file-input{display:none;}

footer.tip{
  margin-top:26px;text-align:center;color:var(--gray);font-size:11.5px;line-height:1.8;
}
</style>
</head>

<script>
/* =========================================================
   STORAGE
========================================================= */
const STORAGE_KEY = 'variableCostToolData_v1';

function defaultData(){ return { courses: [] }; }

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return { courses: Array.isArray(parsed.courses) ? parsed.courses : [] };
  }catch(e){
    console.error('讀取資料失敗', e);
    return defaultData();
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
}

const state = { data: loadData(), view: 'list', currentId: null, refOpen: false };

/* =========================================================
   HELPERS
========================================================= */
function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
function n(v){ const x = parseFloat(v); return isNaN(x) ? 0 : x; }
function money(v){ return 'NT$ ' + Math.round(n(v)).toLocaleString('zh-Hant-TW'); }
function money2(v){
  const val = n(v);
  const rounded = Math.round(val * 100) / 100;
  return 'NT$ ' + rounded.toLocaleString('zh-Hant-TW', {maximumFractionDigits:2});
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* =========================================================
   COST ENGINE
========================================================= */
function itemPerSessionCost(item){
  const amount = n(item.packageAmount);
  if(amount <= 0) return 0;
  return (n(item.packagePrice) / amount) * n(item.perSessionUsage);
}
function courseTotal(course){
  return (course.items||[]).reduce((s,it)=> s + itemPerSessionCost(it), 0);
}

/* =========================================================
   RENDER: ROOT
========================================================= */
function render(){
  if(state.view === 'detail' && state.currentId){ renderDetail(state.currentId); }
  else{ renderList(); }
}

    <p class="hint" style="margin-top:12px;padding-top:10px;border-top:1px dashed rgba(55,53,47,0.1)">提醒事項：</p>
    <ul class="hint-list">
      <li>像美容床、儀器設備這種金額大、用很多年的東西，不算在這裡——那些屬於「裝潢與設備攤提」，不是每堂課消耗掉的東西。這裡只算「每上一次課就會消耗掉」的東西。</li>
      <li>如果覺得每一項都要精算太繁瑣，小額耗材（棉花棒、化妝棉這類）可以憑經驗抓個大概金額就好，把心力放在單價比較高的產品項目上，會更有效率。</li>
      <li>要憑經驗抓金額的話：「包裝總量」和「每堂使用量」都填 1，「包裝金額」直接填你估計這堂課大概會用掉多少錢——這樣算出來的「這項每堂成本」就等於你填的金額，不用真的去查包裝規格。</li>
    </ul>
  </div>
  <div class="row between" style="margin-top:16px">
    <div class="section-title" style="margin-bottom:0"><span class="dot"></span>課程／品項清單</div>
    <button class="btn primary sm" onclick="addCourse()">＋ 新增課程</button>
  </div>
  <div class="course-list">
  `;

  if(courses.length === 0){
    html += `<div class="card"><div class="empty-state">
      <div class="emoji">🧴</div>
      <h3>還沒有任何課程</h3>
      <p>新增一堂課程，開始把裡面用到的產品、耗材一項一項列出來，就能自動算出這堂課的變動成本。</p>
    </div></div>`;
  }else{
    courses.forEach(c=>{
      const total = courseTotal(c);
      const count = (c.items||[]).length;
      html += `
      <div class="course-item" onclick="openDetail('${c.id}')">
        <div class="top">
          <div>
            <h3>${esc(c.name || '未命名課程')}</h3>
            <div class="meta">${count} 項品項</div>
          </div>
          <div class="total">${money2(total)}<small>每堂變動成本</small></div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function addCourse(){
  const c = { id: uid(), name: '', items: [] };
  state.data.courses.push(c);
  saveData();
  openDetail(c.id);
}

/* =========================================================
   RENDER: DETAIL
========================================================= */
function openDetail(id){
  state.view = 'detail';
  state.currentId = id;
  renderDetail(id);
}
function closeDetail(){
  renderList();
}
function toggleRefBox(){
  state.refOpen = !state.refOpen;
  renderDetail(state.currentId);
}

function renderDetail(id){
  const c = state.data.courses.find(x=>x.id===id);
  if(!c){ render(); return; }
  const total = courseTotal(c);

  let itemsHtml = (c.items||[]).map(it=>{
    const cost = itemPerSessionCost(it);
    return `
    <div class="item-card">
      <div class="item-top">
        <input type="text" class="item-name-input" value="${esc(it.name)}" placeholder="請填入品項名稱，例如：化妝棉"
          oninput="updateItem('${c.id}','${it.id}','name', this.value)">
        <div class="rm-btn" onclick="removeItem('${c.id}','${it.id}')">×</div>
      </div>
      <div class="item-grid">
        <div class="mini-field">
          <label>包裝總量</label>
          <input type="number" value="${it.packageAmount||''}" placeholder="請填入" oninput="updateItem('${c.id}','${it.id}','packageAmount', this.value)">
        </div>
        <div class="mini-field">
          <label>包裝金額</label>
          <input type="number" value="${it.packagePrice||''}" placeholder="請填入" oninput="updateItem('${c.id}','${it.id}','packagePrice', this.value)">
        </div>
        <div class="mini-field">
          <label>每堂使用量</label>
          <input type="number" value="${it.perSessionUsage||''}" placeholder="請填入" oninput="updateItem('${c.id}','${it.id}','perSessionUsage', this.value)">
        </div>
      </div>
      <div class="item-cost-line">
        <span>這項每堂成本</span>
        <b>${money2(cost)}</b>
      </div>
    </div>`;
  }).join('');

  if(!itemsHtml){
    itemsHtml = `<div class="card"><div class="empty-state" style="padding:30px 20px">
      <div class="emoji">📋</div>
      <p>還沒有任何品項，先新增一項，例如「化妝棉」「洗卸產品」「保養品」。</p>
    </div></div>`;
  }

  const html = `
  <div class="detail-header">
    <div class="back-btn" onclick="closeDetail()">←</div>
    <input type="text" class="course-name-input" value="${esc(c.name)}" placeholder="請填入課程名稱，例如：韓式清粉刺基礎課"
      oninput="updateCourseName('${c.id}', this.value)">
    <button class="btn danger sm" onclick="deleteCourse('${c.id}')">刪除</button>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="row between" style="cursor:pointer" onclick="toggleRefBox()">
      <div class="section-title" style="margin-bottom:0"><span class="dot"></span>這堂課可能會用到哪些東西？（參考）</div>
      <span id="refToggleIcon" style="color:var(--gray);font-size:13px">${state.refOpen ? '收起 ▴' : '展開 ▾'}</span>
    </div>
    <div id="refBox" class="${state.refOpen ? '' : 'hidden'}" style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
      <div>
        <b style="font-size:12.5px;color:var(--pink)">🧴 清潔／卸妝類</b>
        <p class="hint" style="margin-top:3px">卸妝油／卸妝乳、洗面乳、化妝棉、紗布巾、濕紙巾</p>
      </div>
      <div>
        <b style="font-size:12.5px;color:var(--pink)">💆 保養／護膚品類</b>
        <p class="hint" style="margin-top:3px">精華液、安瓶、面膜、按摩霜／按摩油、凝膠、化妝水、乳液、防曬</p>
      </div>
      <div>
        <b style="font-size:12.5px;color:var(--pink)">🧻 拋棄式耗材</b>
        <p class="hint" style="margin-top:3px">拋棄式浴帽、拋棄式內衣褲、酒精棉片、棉花棒、手套、拋棄式床單／枕巾、紙拖鞋、洗臉海綿/洗臉巾、一次性工具</p>
      </div>
      <div>
        <b style="font-size:12.5px;color:var(--pink)">🔁 可重複使用用品（會耗損、要分攤成本的）</b>
        <p class="hint" style="margin-top:3px">毛巾、髮帶、能重複使用但有壽命的小工具等——把「這批可以用幾次」填在「包裝總量」欄位，一樣能算出每堂該分攤多少錢</p>
      </div>
      <p class="hint" style="margin-top:2px;padding-top:10px;border-top:1px dashed rgba(55,53,47,0.1)">提醒事項：</p>
      <ul class="hint-list">
        <li>像美容床、儀器設備這種金額大、用很多年的東西，不算在這裡——那些屬於「裝潢與設備攤提」，不是每堂課消耗掉的東西。這裡只算「每上一次課就會消耗掉」的東西。</li>
        <li>如果覺得每一項都要精算太繁瑣，小額耗材（棉花棒、化妝棉這類）可以憑經驗抓個大概金額就好，把心力放在單價比較高的產品項目上，會更有效率。</li>
        <li>要憑經驗抓金額的話：「包裝總量」和「每堂使用量」都填 1，「包裝金額」直接填你估計這堂課大概會用掉多少錢——這樣算出來的「這項每堂成本」就等於你填的金額，不用真的去查包裝規格。</li>
      </ul>
    </div>
  </div>

  <p class="hint" style="margin-bottom:14px">
    包裝總量與每堂使用量請用同一個單位（例如都用「片」或都用「ml」）。<br>
    例如：一包 100 片的化妝棉，買 150 元，每堂用 2 片 → 每堂成本 = 150 ÷ 100 × 2 = 3 元。
  </p>

  ${itemsHtml}

  <button class="btn ghost block" style="margin-top:4px" onclick="addItem('${c.id}')">＋ 新增品項</button>
  <p class="hint" style="text-align:center;margin-top:8px">填寫完這堂課之後，按左上角「←」即可返回上一頁，繼續新增下一堂課程。</p>

  <div class="total-box">
    <div class="tlabel">這堂課每堂變動成本合計</div>
    <div class="tvalue">${money2(total)}</div>
    <div class="thint">調查完之後，把這個數字填到「美業課程定價試算工具」課程表單裡的「每堂變動成本」欄位即可。<br>（付費工具，現正預購價 599 元，正式上架後即調漲至 899 元，歡迎私訊黛拉官方帳號洽詢）</div>
    <button class="btn primary sm copy-btn" onclick="copyTotal(${total})">複製這個數字</button>
  </div>
  `;
  document.getElementById('main').innerHTML = html;
}

function updateCourseName(courseId, value){
  const c = state.data.courses.find(x=>x.id===courseId);
  if(!c) return;
  c.name = value;
  saveData();
}

function addItem(courseId){
  const c = state.data.courses.find(x=>x.id===courseId);
  if(!c) return;
  c.items = c.items || [];
  c.items.push({ id: uid(), name:'', packageAmount:0, packagePrice:0, perSessionUsage:0 });
  saveData();
  renderDetail(courseId);
}

function updateItem(courseId, itemId, key, value){
  const c = state.data.courses.find(x=>x.id===courseId);
  if(!c) return;
  const it = (c.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  const numeric = ['packageAmount','packagePrice','perSessionUsage'];
  it[key] = numeric.includes(key) ? n(value) : value;
  saveData();
  // Only refresh the cost line + total without rebuilding the whole form (keeps input focus)
  refreshDetailNumbers(courseId);
}

function refreshDetailNumbers(courseId){
  const c = state.data.courses.find(x=>x.id===courseId);
  if(!c) return;
  document.querySelectorAll('.item-card').forEach((card, idx)=>{
    const it = (c.items||[])[idx];
    if(!it) return;
    const costEl = card.querySelector('.item-cost-line b');
    if(costEl) costEl.textContent = money2(itemPerSessionCost(it));
  });
  const total = courseTotal(c);
  const tvalue = document.querySelector('.total-box .tvalue');
  if(tvalue) tvalue.textContent = money2(total);
  const copyBtn = document.querySelector('.total-box .copy-btn');
  if(copyBtn) copyBtn.setAttribute('onclick', `copyTotal(${total})`);
}

function removeItem(courseId, itemId){
  const c = state.data.courses.find(x=>x.id===courseId);
  if(!c) return;
  c.items = (c.items||[]).filter(i=>i.id!==itemId);
  saveData();
  renderDetail(courseId);
}

function deleteCourse(courseId){
  if(!confirm('確定要刪除這堂課程的變動成本清單嗎？此動作無法復原。')) return;
  state.data.courses = state.data.courses.filter(c=>c.id!==courseId);
  saveData();
  render();
  showToast('已刪除');
}

function copyTotal(total){
  const rounded = Math.round(n(total) * 100) / 100;
  const text = String(rounded);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('已複製數字：' + text))
      .catch(()=> showToast('複製失敗，請手動選取數字'));
  }else{
    showToast('這個瀏覽器不支援自動複製，請手動選取數字');
  }
}

/* =========================================================
   BACKUP: EXPORT / IMPORT
========================================================= */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `變動成本調查備份_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔');
});

document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object' || !('courses' in parsed)){
        showToast('檔案格式不正確');
        return;
      }
      if(!confirm('匯入將會覆蓋目前所有資料，確定要繼續嗎？')) return;
      state.data = { courses: Array.isArray(parsed.courses) ? parsed.courses : [] };
      saveData();
      render();
      showToast('已匯入備份資料');
    }catch(err){
      showToast('讀取檔案失敗，請確認檔案內容');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   INIT
========================================================= */
render();
</script>
</body>
</html>
